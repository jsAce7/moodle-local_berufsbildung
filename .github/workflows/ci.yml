name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            moodle-branch: 'MOODLE_405_STABLE'
            database: 'pgsql'
          - php: '8.4'
            moodle-branch: 'MOODLE_503_STABLE'
            database: 'mariadb'

    services:
      # Moodle 5.3 verlangt mindestens PostgreSQL 17 und MariaDB 11.4,
      # beide decken auch Moodle 4.5 ab. Ab MariaDB 11 fehlt mysqladmin im
      # Image, der Healthcheck laeuft deshalb ueber healthcheck.sh.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mysqli, zip, gd, xmlrpc, soap, intl, mbstring, xml
          ini-values: max_input_vars=5000
          coverage: none

      - name: Deploy moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install Moodle + plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        run: moodle-plugin-ci phplint

      - name: PHP Copy/Paste Detector
        continue-on-error: true
        run: moodle-plugin-ci phpcpd

      - name: PHP Mess Detector
        continue-on-error: true
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        run: moodle-plugin-ci codechecker --max-warnings 0

      - name: Moodle PHPDoc Checker
        run: moodle-plugin-ci phpdoc

      - name: Validating
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        run: moodle-plugin-ci mustache

      # Prueft, dass amd/build zu amd/src passt, und lintet das JavaScript.
      - name: Grunt
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        run: moodle-plugin-ci behat --profile chrome

  # Veroeffentlicht nach gruener CI auf main ein GitHub-Release mit dem
  # installierbaren ZIP, sobald es zu $plugin->release in version.php noch
  # keines gibt. Ein gewoehnlicher Push genuegt, der Tag v<release> entsteht
  # dabei auf dem gepushten Stand. Verglichen wird mit den bestehenden
  # Releases, nicht mit dem Stand vor dem Push: war die CI beim Push mit der
  # neuen Version rot, holt der naechste gruene Push das Release nach. Von
  # Hand gestartet (workflow_dispatch auf main) ebenso.
  release:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version aus version.php lesen
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          lies_release() { sed -n "s/^\$plugin->release *= *'\(.*\)';.*/\1/p"; }
          kein_release() { echo "$1"; echo "neu=false" >> "$GITHUB_OUTPUT"; exit 0; }
          release=$(lies_release < version.php)
          maturity=$(sed -n "s/^\$plugin->maturity *= *\(MATURITY_[A-Z]*\);.*/\1/p" version.php)
          if [ -z "$release" ] || [ -z "$maturity" ]; then
            echo "::error::\$plugin->release oder \$plugin->maturity nicht gefunden."
            exit 1
          fi
          tag="v$release"
          if gh release view "$tag" > /dev/null 2>&1; then
            kein_release "Release $tag gibt es schon, nichts zu tun."
          fi
          echo "neu=true" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "maturity=$maturity" >> "$GITHUB_OUTPUT"

      - name: Release-Notizen aus dem CHANGELOG
        if: steps.version.outputs.neu == 'true'
        env:
          RELEASE: ${{ steps.version.outputs.release }}
        run: |
          set -euo pipefail
          # Abschnitt "## [<release>] — <datum>" bis zur naechsten Version.
          awk -v kopf="## [$RELEASE]" '
            index($0, kopf) == 1 { drin = 1; next }
            drin && /^## \[/ { exit }
            drin { print }
          ' CHANGELOG.md > notizen.md
          if ! grep -q '[^[:space:]]' notizen.md; then
            echo "::error::CHANGELOG.md hat keinen Abschnitt fuer $RELEASE."
            exit 1
          fi

      - name: ZIP bauen
        if: steps.version.outputs.neu == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Der Ordner im Archiv heisst wie das Plugin unterhalb von local/,
          # damit sich das ZIP direkt ueber die Moodle-Plugin-Installation
          # einspielen laesst. export-ignore aus .gitattributes greift hier.
          git archive --format=zip --prefix=berufsbildung/ \
            -o "local_berufsbildung-${TAG}.zip" HEAD
          unzip -l "local_berufsbildung-${TAG}.zip"

      - name: Release veroeffentlichen
        if: steps.version.outputs.neu == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          MATURITY: ${{ steps.version.outputs.maturity }}
        run: |
          set -euo pipefail
          # Alpha, Beta und RC erscheinen als Vorabversion.
          releaseargs=()
          if [ "$MATURITY" != "MATURITY_STABLE" ]; then
            releaseargs+=(--prerelease)
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "local_berufsbildung $TAG" \
            --notes-file notizen.md \
            "${releaseargs[@]}" \
            "local_berufsbildung-${TAG}.zip"
